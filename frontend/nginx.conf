# Spec §1.1, §11: serves the built frontend and proxies the API, so the browser sees one origin (no CORS).
server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS, looked up per request: a recreated api container gets a new IP, which a name resolved once
  # at start would miss. With a variable, proxy_pass forwards the original URI unchanged.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:3000;

  location /api/ {
    proxy_pass $api;
  }

  location = /health {
    proxy_pass $api;
  }

  # Vite puts a content hash in every asset file name, so a file never changes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes (/receiving/...) get the app. no-cache: after a rebuild the browser must not keep an
  # index.html that points at hashed asset files which no longer exist.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
